name: Unsigned Windows preview

on:
  push:
    branches:
      - codex/cloud-successor-1.3.13
    paths:
      - .github/workflows/windows-preview.yml

permissions:
  contents: write

concurrency:
  group: forgedocuments-unsigned-windows-preview
  cancel-in-progress: false

env:
  # Audited source commit; the workflow-only commit is not the release target.
  SOURCE_SHA: 42747e0f239336750651a28e51ebb8b8db8fab57
  PREVIEW_TAG: v1.3.14-preview.1
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build-validate-publish:
    if: github.repository == 'graphite1/Forgedocuments_GR' && github.ref == 'refs/heads/codex/cloud-successor-1.3.13'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out audited implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          architecture: x64

      - name: Refuse duplicate releases before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B tools/preview_release.py guard --source "$env:SOURCE_SHA" --tag "$env:PREVIEW_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run isolated headless source checks
        run: |
          python -B verify_cloud.py --cid-font --headless --report "$env:RUNNER_TEMP/forge-source-tests.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned confirmation ZIP
        run: |
          python -B tools/build_windows.py --unsigned --prerelease-preview --output "$env:RUNNER_TEMP/forge-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit bundle and run clean-extraction EXE and source BAT without GUI
        run: |
          python -B tools/preview_release.py audit --source "$env:SOURCE_SHA" --output "$env:RUNNER_TEMP/forge-preview" --tests "$env:RUNNER_TEMP/forge-source-tests.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish nonlatest prerelease and re-download every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B tools/preview_release.py publish --source "$env:SOURCE_SHA" --tag "$env:PREVIEW_TAG" --output "$env:RUNNER_TEMP/forge-preview"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP/forge-preview/download-verification.json" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
